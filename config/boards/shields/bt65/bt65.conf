# BT65 键盘配置
# Nice!Nano v2 (nRF52840) 主控

# 基本功能
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# ZMK Studio（运行时 keymap 编辑）
CONFIG_ZMK_STUDIO=y
# Studio 解锁方式：使用按键组合解锁（默认双 Shift）
# Studio 通过 USB 连接时自动锁定，需要物理按键解锁
CONFIG_ZMK_STUDIO_LOCKING=y
# 启用 OLED 显示时需要此项（如果未来加屏幕）
# CONFIG_ZMK_STUDIO_CONDITIONAL=y

# WS2812 RGB 灯效
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SPD_STEP=10
# 默认灯效模式（0=关闭, 1=单色, 2=呼吸, 3=光谱, 4=彩虹等）
CONFIG_ZMK_RGB_UNDERGLOW_DEFAULT_EFFECT=3

# GPIO 输出（用于 RGB 电源控制和 LED 指示灯）
CONFIG_ZMK_OUTPUT_GPIO=y
